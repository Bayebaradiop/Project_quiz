  # ==================== PARTICIPATIONS ====================
  /participations/quiz/{quiz_id}:
    post:
      tags: [Participations]
      summary: "CAS 1: Démarrer une participation à un QUIZ PUBLIC"
      description: |
        ## 🌍 Participation à un quiz PUBLIC (sans invitation)
        
        **Utilisé pour:**
        - Quiz visibles dans la liste publique (`GET /quizzes` sans auth)
        - Quiz avec `statut: "publie"` ET `est_public: true`
        - N'importe qui peut participer sans code d'invitation
        
        **Workflow:**
        1. Utilisateur consulte `GET /quizzes` (sans auth) → reçoit liste des quiz publics
        2. Utilisateur choisit un quiz → récupère son `quiz_id` crypté (ex: "VAG7e3Qj")
        3. Utilisateur démarre participation avec cet endpoint
        4. Backend vérifie que le quiz est bien public et publié
        
        **⚠️ IMPORTANT:** Le quiz doit avoir `statut: "publie"` sinon erreur 400
        
        **Utiliser l'ID crypté du quiz!**
      parameters:
        - name: quiz_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
          description: ID crypté du quiz public (reçu de GET /quizzes)
          example: "VAG7e3Qj"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: Email du participant (optionnel)
                nom_participant:
                  type: string
                  description: Nom du participant (optionnel)
            example:
              email: "participant@example.com"
              nom_participant: "Marie Dubois"
      responses:
        '201':
          description: Participation démarrée avec IDs cryptés
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      participation:
                        $ref: '#/components/schemas/Participation'
              example:
                success: true
                data:
                  participation:
                    id: "Rb3Wb19k"
                    quiz_id: "VAG7e3Qj"
                    statut: "en_cours"
                    email_participant: "participant@example.com"
        '400':
          description: Quiz non disponible (brouillon ou archivé)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                success: false
                message: "Ce quiz n'est pas encore disponible"

  /participations:
    post:
      tags: [Participations]
      summary: "CAS 2: Démarrer une participation avec CODE D'INVITATION"
      description: |
        ## ✉️ Participation via invitation (quiz privé OU public)

        **Utilisé pour:**
        - Quiz avec invitations envoyées par email
        - Quiz privés (`est_public: false`) - UNIQUEMENT accessible par invitation
        - Quiz publics avec invitations personnalisées

        **Workflow complet d'invitation :**
        1. Créateur crée invitation → `POST /invitations/quizzes/{quizId}/invitations` (email envoyé automatiquement)
        2. Participant reçoit email avec `code_acces` et lien d'invitation
        3. Participant clique sur le lien ou utilise le code directement
        4. Participant valide le code → `POST /invitations/validate` (optionnel)
        5. Participant démarre participation avec cet endpoint
        6. Backend récupère automatiquement le `quiz_id` depuis l'invitation

        **⚠️ DIFFÉRENCE CLÉS:**
        - `quiz_id` N'EST PAS requis (calculé depuis l'invitation)
        - Fonctionne même si le quiz est privé
        - Code d'invitation doit être valide et non expiré
        - **Email automatique :** Un email de confirmation peut être envoyé lors de la participation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code_acces]
              properties:
                code_acces:
                  type: string
                  description: Code d'invitation reçu par email (32 caractères hexadécimaux)
                  example: "df22be74d996f008cb04ee412b5f1aa1"
                email_participant:
                  type: string
                  format: email
                  description: Email du participant (optionnel si déjà dans l'invitation)
                nom_participant:
                  type: string
                  description: Nom du participant (optionnel)
            example:
              code_acces: "df22be74d996f008cb04ee412b5f1aa1"
              email_participant: "invite@example.com"
      responses:
        '201':
          description: Participation démarrée via invitation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      participation:
                        $ref: '#/components/schemas/Participation'
              example:
                success: true
                message: "Participation démarrée avec succès"
                data:
                  participation:
                    id: "Rb3Wb19k"
                    quiz_id: "VAG7e3Qj"
                    statut: "en_cours"
        '400':
          description: Code d'invitation invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                code_invalide:
                  summary: Code invalide
                  value:
                    success: false
                    message: "Code d'invitation invalide"
                code_expire:
                  summary: Code expiré
                  value:
                    success: false
                    message: "Ce code d'invitation a expiré"

  /participations/{id}/questions/{question_id}/reponse:
    post:
      tags: [Participations]
      summary: Soumettre une réponse à une question
      description: |
        **IMPORTANT - ZÉRO LOGIQUE FRONTEND:**
        - `id`: ID crypté de la participation (reçu à l'étape précédente)
        - `question_id`: ID crypté de la question (reçu dans la liste des questions)
        - `reponse_id`: ID crypté du choix (reçu dans la liste des choix)
        
        **Le frontend envoie directement les hashs reçus - aucun encodage à faire!**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
          description: ID crypté de la participation
          example: "Rb3Wb19k"
        - name: question_id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
          description: ID crypté de la question
          example: "w5PXz1KX"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reponse_id:
                  description: |
                    **ID crypté du choix de réponse OU ID numérique (compatibilité)**
                    Le backend décode automatiquement les hashs!
                  oneOf:
                    - $ref: '#/components/schemas/HashId'
                    - type: integer
                  example: "Xk12dYPg"
                temps_reponse:
                  type: integer
                  description: Temps de réponse en secondes
            examples:
              avec_hash:
                summary: Avec ID crypté (recommandé)
                value:
                  reponse_id: "Xk12dYPg"
                  temps_reponse: 15
              avec_id_numerique:
                summary: Avec ID numérique (compatibilité)
                value:
                  reponse_id: 100
      responses:
        '200':
          description: Réponse enregistrée
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                    example: "Réponse enregistrée avec succès"

  /participations/{id}/terminer:
    post:
      tags: [Participations]
      summary: Terminer une participation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
          example: "Rb3Wb19k"
      responses:
        '200':
          description: Participation terminée avec résultats
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      participation:
                        $ref: '#/components/schemas/Participation'
                      reponses:
                        type: array
                        items:
                          type: object
                          properties:
                            question_id:
                              $ref: '#/components/schemas/HashId'
                            texte_question:
                              type: string
                            votre_reponse:
                              type: string
                            est_correcte:
                              type: boolean
                            points_obtenus:
                              type: integer
              example:
                success: true
                data:
                  participation:
                    id: "Rb3Wb19k"
                    score: 8
                    score_max: 10
                    pourcentage: 80
                  reponses:
                    - question_id: "w5PXz1KX"
                      est_correcte: true
                      points_obtenus: 1

  /participations/{id}:
    get:
      tags: [Résultats]
      summary: Récupérer les résultats d'une participation
      description: |
        Récupère les résultats complets d'une participation terminée.
        **Tous les IDs dans la réponse sont cryptés!**
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
          example: "Rb3Wb19k"
      responses:
        '200':
          description: Résultats de la participation
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Participation'
                      - type: object
                        properties:
                          quiz:
                            $ref: '#/components/schemas/Quiz'
                          reponses:
                            type: array
                            items:
                              type: object
                              properties:
                                question_id:
                                  $ref: '#/components/schemas/HashId'
                                texte_question:
                                  type: string
                                votre_reponse:
                                  type: string
                                est_correcte:
                                  type: boolean
                                points_obtenus:
                                  type: integer

  # ==================== GÉNÉRATION IA ====================
  /quizzes/{quizId}/generate-questions:
    post:
      tags: [Intelligence Artificielle]
      summary: "🤖 Générer des questions via IA (texte libre)"
      description: |
        ## 🚀 Génération automatique de questions par IA + Création en base de données
        
        Génère des questions de quiz à partir d'un simple prompt textuel **ET les crée automatiquement en base de données**.
        
        **🔥 Powered by Groq (Llama 3.3 70B)**
        - Ultra rapide (~2 secondes)
        - Questions de haute qualité pédagogique
        - Explications détaillées
        
        **✅ Système de fallback intelligent :**
        1. Groq API (priorité 1 - recommandé)
        2. Hugging Face (fallback)
        3. OpenAI (fallback)
        4. Générateur local (dernier recours)
        
        **📝 Traitement automatique :**
        1. Génération via IA selon le prompt
        2. Parsing et validation du format JSON
        3. Mapping automatique vers le format de votre base de données
        4. Validation avec le même schéma que l'ajout manuel (`createQuestionSchema`)
        5. **Création automatique de chaque question en base avec `QuestionService`**
        6. Retour des questions créées (avec IDs cryptés)
        
        **⚙️ Format attendu par l'IA (automatiquement normalisé) :**
        - `texte` ou `question` → texte de la question
        - `duree` ou `duration` → durée en secondes (défaut: 30)
        - `ordre` → ordre de la question (auto-incrémenté)
        - `choix_reponses` ou `options` → tableau de choix
          - Chaque choix : `texte`, `est_correcte`, `ordre`
        - `correct_answer` → texte de la bonne réponse (mapping automatique)
        
        **✅ Avantages :**
        - Même logique que l'ajout manuel de questions
        - Validation stricte (min 2 choix, au moins 1 correct)
        - Questions immédiatement disponibles dans le quiz
        - Format de réponse identique à `POST /quizzes/:quizId/questions`
        
        **Cas d'usage :**
        - Création rapide de quiz complet
        - Import en masse de questions
        - Génération contextuelle (avec ou sans document)
      security:
        - cookieAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
          example: "Qp3ndGMw"
          description: ID crypté du quiz
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt]
              properties:
                prompt:
                  type: string
                  description: Instructions pour la génération des questions
                  example: "Génère 5 questions à choix multiples sur le thème de la photosynthèse en biologie."
      responses:
        '201':
          description: Questions générées ET créées en base de données avec succès
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Format pour UNE seule question générée (identique à la création manuelle)
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: "Question créée avec succès"
                      data:
                        type: object
                        properties:
                          id:
                            $ref: '#/components/schemas/HashId'
                          texte:
                            type: string
                            example: "Qu'est-ce que la photosynthèse ?"
                          duree:
                            type: integer
                            example: 30
                          ordre:
                            type: integer
                            example: 1
                          quiz_id:
                            $ref: '#/components/schemas/HashId'
                          createdAt:
                            type: object
                          updatedAt:
                            type: object
                          deletedAt:
                            type: null
                          choix_reponses:
                            type: array
                            description: "Chaque question a plusieurs réponses, UNE SEULE est correcte (est_correcte: true)"
                            items:
                              type: object
                              properties:
                                id:
                                  $ref: '#/components/schemas/HashId'
                                question_id:
                                  $ref: '#/components/schemas/HashId'
                                texte:
                                  type: string
                                  example: "Un processus biologique"
                                est_correcte:
                                  type: boolean
                                  description: "true = bonne réponse, false = mauvaise réponse. UNE SEULE réponse a est_correcte: true"
                                  example: true
                                ordre:
                                  type: integer
                                  example: 1
                                createdAt:
                                  type: object
                                updatedAt:
                                  type: object
                  - type: object
                    description: Format pour PLUSIEURS questions générées
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: "3 questions créées avec succès"
                      data:
                        type: array
                        description: Tableau des questions créées (même structure que ci-dessus pour chaque question)
                        items:
                          type: object
                          properties:
                            id:
                              $ref: '#/components/schemas/HashId'
                            texte:
                              type: string
                            duree:
                              type: integer
                            ordre:
                              type: integer
                            quiz_id:

openapi: 3.0.3
info:
  title: QuizLab API
  description: |
    API REST complète pour la gestion de quiz avec système de cryptage automatique des IDs.
  version: 1.0.0
  contact:
    name: API Support
    email: support@quizlab.com
  license:
    name: MIT

servers:
  - url: /api/v1
    description: "Base path for API (routes mounted under /api/v1 in server.ts)"

components:
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: "Erreur lors de l'opération"
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    HashId:
      type: string
      description: ID crypté avec HashIds (8+ caractères alphanumériques)
      example: "VAG7e3Qj"
      pattern: "^[A-Za-z0-9]{8,}$"

    Utilisateur:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/HashId'
        prenom:
          type: string
          example: "Jean"
        nom:
          type: string
          example: "Dupont"
        email:
          type: string
          format: email
          example: "jean.dupont@example.com"
        role:
          type: string
          enum: [admin, user]
          example: "user"
        statut:
          type: string
          enum: [actif, inactif, bloque]
          example: "actif"

    Quiz:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/HashId'
        titre:
          type: string
          example: "Quiz JavaScript Avancé"
        description:
          type: string
          example: "Testez vos connaissances en JavaScript"
        type_quiz:
          type: string
          enum: [instantane, programme]
          example: "instantane"
        statut:
          type: string
          enum: [brouillon, publie, archive]
          example: "publie"
        est_public:
          type: boolean
          example: true
        lien_partage:
          type: string
          example: "7a420657c4a9bbece98f9336b0bb36a5"
        nb_questions:
          type: integer
          example: 10
        duree_totale:
          type: integer
          description: Durée totale en secondes
          example: 600
        createur_id:
          $ref: '#/components/schemas/HashId'
        createur:
          $ref: '#/components/schemas/Utilisateur'
        questions:
          type: array
          items:
            $ref: '#/components/schemas/Question'

    Question:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/HashId'
        texte:
          type: string
          example: "Quelle est la différence entre let et var ?"
        duree:
          type: integer
          description: Durée en secondes
          example: 30
        ordre:
          type: integer
          example: 1
        choix:
          type: array
          items:
            $ref: '#/components/schemas/ChoixReponse'

    ChoixReponse:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/HashId'
        texte:
          type: string
          example: "let a une portée de bloc"
        ordre:
          type: integer
          example: 1

    Invitation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/HashId'
        quiz_id:
          $ref: '#/components/schemas/HashId'
        email:
          type: string
          format: email
          example: "participant@example.com"
        nom:
          type: string
          example: "Martin"
        prenom:
          type: string
          example: "Sophie"
        statut:
          type: string
          enum: [en_attente, accepte, refuse, expiree]
          example: "en_attente"
        code_acces:
          type: string
          example: "df22be74d996f008cb04ee412b5f1aa1"
        date_expiration:
          type: string
          format: date-time

    Participation:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/HashId'
        quiz_id:
          $ref: '#/components/schemas/HashId'
        utilisateur_id:
          $ref: '#/components/schemas/HashId'
        email_participant:
          type: string
          format: email
        nom_participant:
          type: string
        statut:
          type: string
          enum: [en_cours, termine, abandonne]
          example: "en_cours"
        score:
          type: integer
          nullable: true
          example: 8
        score_max:
          type: integer
          nullable: true
          example: 10
        pourcentage:
          type: integer
          nullable: true
          example: 80
        temps_total:
          type: integer
          nullable: true
          description: Temps total en secondes
        date_debut:
          type: string
          format: date-time
        date_fin:
          type: string
          format: date-time
          nullable: true

paths:
  # ==================== UTILISATEURS ====================
  /utilisateurs/register:
    post:
      tags: [Utilisateurs]
      summary: Inscription d'un nouvel utilisateur
      description: Crée un compte utilisateur et retourne un cookie httpOnly avec le JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prenom, nom, email, password]
              properties:
                prenom:
                  type: string
                  minLength: 2
                  example: "Jean"
                nom:
                  type: string
                  minLength: 2
                  example: "Dupont"
                email:
                  type: string
                  format: email
                  example: "jean.dupont@example.com"
                password:
                  type: string
                  minLength: 8
                  description: Doit contenir majuscule, minuscule, chiffre et caractère spécial
                  example: "Test@123456"
      responses:
        '201':
          description: Utilisateur créé avec succès
          headers:
            Set-Cookie:
              schema:
                type: string
                example: token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; HttpOnly; Path=/
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Utilisateur créé avec succès"
                  utilisateur:
                    $ref: '#/components/schemas/Utilisateur'

  /utilisateurs/login:
    post:
      tags: [Utilisateurs]
      summary: Connexion utilisateur
      description: Authentifie l'utilisateur et retourne un cookie httpOnly avec le JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: "jean.dupont@example.com"
                password:
                  type: string
                  example: "Test@123456"
      responses:
        '200':
          description: Connexion réussie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  utilisateur:
                    $ref: '#/components/schemas/Utilisateur'

  /utilisateurs/{id}:
    get:
      tags: [Utilisateurs]
      summary: Récupérer un utilisateur par ID crypté
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
          example: "bvGl0G4V"
      responses:
        '200':
          description: Utilisateur trouvé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  utilisateur:
                    $ref: '#/components/schemas/Utilisateur'

  /utilisateurs/roles:
    get:
      tags: [Utilisateurs]
      summary: Récupérer tous les rôles disponibles
      description: Retourne la liste des rôles disponibles pour les utilisateurs.
      responses:
        '200':
          description: Liste des rôles
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /utilisateurs/logout:
    post:
      tags: [Utilisateurs]
      summary: Déconnexion utilisateur
      description: Déconnecte l'utilisateur en supprimant le cookie JWT.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Déconnexion réussie

  # ==================== QUIZ ====================
  /quizzes:
    get:
      tags: [Quiz]
      summary: "📋 Liste des quiz PUBLICS (sans authentification)"
      description: |
        ## 🌍 Endpoint PUBLIC - Aucune authentification requise
        
        Retourne UNIQUEMENT les quiz **publiés** (`statut: "publie"`).
        
        **❌ Informations EXCLUES (sécurité) :**
        - `est_correcte` dans les choix de réponses (bonnes réponses cachées)
        - `invitations` (données privées du créateur)
        - `participations` (données privées)
        - `email` du créateur (vie privée)
        
        **✅ Informations INCLUSES :**
        - Titre, description du quiz
        - Questions et choix de réponses (sans les bonnes réponses)
        - Nom/prénom du créateur
        - IDs cryptés automatiquement
        
        **Cas d'usage :** Page d'accueil avec liste des quiz disponibles
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
          example: 10
          description: Nombre maximum de quiz à retourner
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
          description: Pagination - position de départ
      responses:
        '200':
          description: Liste des quiz publics (sans bonnes réponses, invitations, participations)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      quizzes:
                        type: array
                        description: Quiz publics publiés
                        items:
                          type: object
                          properties:
                            id:
                              $ref: '#/components/schemas/HashId'
                            titre:
                              type: string
                            description:
                              type: string
                            type_quiz:
                              type: string
                            statut:
                              type: string
                              example: "publie"
                            createur:
                              type: object
                              properties:
                                id:
                                  $ref: '#/components/schemas/HashId'
                                prenom:
                                  type: string
                                nom:
                                  type: string
                            questions:
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    $ref: '#/components/schemas/HashId'
                                  texte:
                                    type: string
                                  duree:
                                    type: integer
                                  ordre:
                                    type: integer
                                  choix_reponses:
                                    type: array
                                    description: "⚠️ SANS est_correcte (bonnes réponses cachées)"
                                    items:
                                      type: object
                                      properties:
                                        id:
                                          $ref: '#/components/schemas/HashId'
                                        texte:
                                          type: string
                                        ordre:
                                          type: integer
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      total:
                        type: integer
              example:
                success: true
                data:
                  quizzes:
                    - id: "VAG7e3Qj"
                      titre: "Quiz JavaScript"
                      statut: "publie"
                      createur:
                        id: "2m3KMGnQ"
                        prenom: "Jean"
                        nom: "Dupont"
                      questions:
                        - id: "9x360G5g"
                          texte: "Quelle est la différence entre let et var ?"
                          duree: 30
                          ordre: 1
                          choix_reponses:
                            - id: "4JGR4Q36"
                              texte: "let a une portée de bloc"
                              ordre: 1
                            - id: "6bPLmwGO"
                              texte: "var a une portée de fonction"
                              ordre: 2
                pagination:
                  page: 1
                  total: 5

  /quizzes/mes-quiz:
    get:
      tags: [Quiz]
      summary: "🔒 Mes quiz (avec authentification - TOUTES les informations)"
      description: |
        ## 🔐 Endpoint PROTÉGÉ - Authentification requise
        
        Retourne TOUS les quiz créés par l'utilisateur connecté.
        
        **✅ TOUTES les informations incluses :**
        - `est_correcte` dans les choix (bonnes réponses visibles)
        - `invitations` complètes avec codes d'accès
        - `participations` avec scores et statuts
        - Statistiques complètes
        - Brouillons, publiés, archivés
        
        **Cas d'usage :** Dashboard créateur pour gérer ses quiz
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Liste complète de mes quiz avec toutes les informations
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      mes_quiz:
                        type: array
                        items:
                          allOf:
                            - $ref: '#/components/schemas/Quiz'
                            - type: object
                              properties:
                                questions:
                                  type: array
                                  items:
                                    type: object
                                    properties:
                                      choix_reponses:
                                        type: array
                                        description: "✅ AVEC est_correcte (bonnes réponses visibles pour le créateur)"
                                        items:
                                          type: object
                                          properties:
                                            id:
                                              $ref: '#/components/schemas/HashId'
                                            texte:
                                              type: string
                                            est_correcte:
                                              type: boolean
                                            ordre:
                                              type: integer
                                invitations:
                                  type: array
                                  description: "✅ Liste complète des invitations"
                                  items:
                                    $ref: '#/components/schemas/Invitation'
                                participations:
                                  type: array
                                  description: "✅ Liste complète des participations"
                                  items:
                                    $ref: '#/components/schemas/Participation'
              example:
                success: true
                data:
                  mes_quiz:
                    - id: "ayPEZGOl"
                      titre: "Quiz JavaScript Avancé"
                      statut: "brouillon"
                      questions:
                        - id: "9x360G5g"
                          texte: "Quelle est la différence entre let et var ?"
                          choix_reponses:
                            - id: "4JGR4Q36"
                              texte: "let a une portée de bloc"
                              est_correcte: true
                              ordre: 1
                            - id: "6bPLmwGO"
                              texte: "var a une portée de fonction"
                              est_correcte: false
                              ordre: 2
                      invitations:
                        - id: "bvGl0G4V"
                          email: "participant@example.com"
                          code_acces: "c50a5d28b11ed892ec6784efaedeb3e7"
                          statut: "accepte"
                      participations:
                        - id: "Rb3Wb19k"
                          email_participant: "user@example.com"
                          score: 8
                          statut: "termine"
        '401':
          description: Non authentifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    post:
      tags: [Quiz]
      summary: Créer un nouveau quiz
      description: |
        Crée un quiz avec ses questions. 
        **L'ID retourné sera automatiquement crypté!**
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, type_quiz]
              properties:
                titre:
                  type: string
                  example: "Quiz JavaScript Avancé"
                description:
                  type: string
                categorie:
                  type: string
                type_quiz:
                  type: string
                  enum: [instantane, programme]
                niveau_difficulte:
                  type: string
                  enum: [facile, moyen, difficile]
                duree_minutes:
                  type: integer
                score_minimum:
                  type: integer
                est_public:
                  type: boolean
      responses:
        '201':
          description: Quiz créé avec ID crypté
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Quiz'
              example:
                success: true
                message: "Quiz créé avec succès"
                data:
                  id: "VAG7e3Qj"
                  titre: "Quiz JavaScript Avancé"

  /quizzes/{id}:
    get:
      tags: [Quiz]
      summary: Détails d'un quiz par ID crypté
      description: |
        **IMPORTANT:** Utiliser l'ID crypté reçu de l'API (ex: "VAG7e3Qj")
        Le backend décode automatiquement!
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
          description: ID crypté du quiz
          example: "VAG7e3Qj"
      responses:
        '200':
          description: Détails du quiz avec tous les IDs cryptés
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Quiz'

    put:
      tags: [Quiz]
      summary: Modifier un quiz
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                titre:
                  type: string
                description:
                  type: string
                statut:
                  type: string
                  enum: [brouillon, publie, archive]
      responses:
        '200':
          description: Quiz modifié

    delete:
      tags: [Quiz]
      summary: Supprimer un quiz
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
      responses:
        '200':
          description: Quiz supprimé

  /quizzes/{id}/publier:
    patch:
      tags: [Quiz]
      summary: Publier un quiz (le rendre disponible)
      description: |
        ## 📢 Publie un quiz pour le rendre accessible
        
        Change le statut du quiz de `"brouillon"` à `"publie"`.
        
        **Conditions pour publier:**
        - Le quiz doit avoir au moins une question
        - Le quiz doit être en statut `"brouillon"`
        - Seul le créateur peut publier son quiz
        
        **Une fois publié:**
        - Le quiz devient visible dans la liste publique (si `est_public: true`)
        - Les participants peuvent commencer à y répondre
        - Les invitations peuvent être envoyées
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
          description: ID crypté du quiz à publier
          example: "VAG7e3Qj"
      responses:
        '200':
          description: Quiz publié avec succès
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Quiz publié avec succès"
                  data:
                    $ref: '#/components/schemas/Quiz'
              example:
                success: true
                message: "Quiz publié avec succès"
                data:
                  id: "VAG7e3Qj"
                  titre: "Quiz JavaScript Avancé"
                  statut: "publie"
                  est_public: true
        '400':
          description: Erreur - conditions non remplies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                pas_de_questions:
                  summary: Aucune question dans le quiz
                  value:
                    success: false
                    message: "Le quiz doit contenir au moins une question"
                deja_publie:
                  summary: Quiz déjà publié
                  value:
                    success: false
                    message: "Ce quiz est déjà publié"
        '404':
          description: Quiz non trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ==================== INVITATIONS ====================
  /invitations/quizzes/{quizId}/invitations:
    post:
      tags: [Invitations]
      summary: Créer une invitation
      description: |
        ## 📧 Créer une invitation pour un quiz

        **Workflow complet d'invitation :**
        1. Créateur crée invitation → `POST /invitations/quizzes/{quizId}/invitations`
        2. Email envoyé automatiquement au participant avec `code_acces`
        3. Participant reçoit email avec lien/code d'invitation
        4. Participant valide code → `POST /invitations/validate` (optionnel)
        5. Participant démarre participation → `POST /participations`

        **Fonctionnalités :**
        - Génération automatique d'un code d'accès unique (32 caractères hexadécimaux)
        - Envoi automatique d'email avec le code d'invitation
        - Expiration automatique après 7 jours
        - Statut de suivi (en_attente, accepte, refuse, expiree)
      security:
        - cookieAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
          description: ID crypté du quiz
          example: "VAG7e3Qj"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, nom, prenom]
              properties:
                email:
                  type: string
                  format: email
                  description: Email du participant à inviter
                  example: "participant@example.com"
                nom:
                  type: string
                  description: Nom du participant
                  example: "Dupont"
                prenom:
                  type: string
                  description: Prénom du participant
                  example: "Marie"
            example:
              email: "participant@example.com"
              nom: "Dupont"
              prenom: "Marie"
      responses:
        '201':
          description: Invitation créée et email envoyé
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: "Invitation envoyée avec succès"
                  data:
                    $ref: '#/components/schemas/Invitation'
                  email_status:
                    type: string
                    enum: [sent, failed]
                    example: "sent"
                    description: "Statut de l'envoi de l'email"
              example:
                success: true
                message: "Invitation envoyée avec succès"
                data:
                  id: "bvGl0G4V"
                  quiz_id: "VAG7e3Qj"
                  email: "participant@example.com"
                  nom: "Dupont"
                  prenom: "Marie"
                  code_acces: "df22be74d996f008cb04ee412b5f1aa1"
                  statut: "en_attente"
                  date_expiration: "2025-11-06T19:50:59+00:00"
                email_status: "sent"
        '400':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                email_deja_invite:
                  summary: Email déjà invité
                  value:
                    success: false
                    message: "Cet email a déjà été invité pour ce quiz"
        '403':
          description: Non autorisé (pas le créateur du quiz)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /invitations/validate:
    post:
      tags: [Invitations]
      summary: Valider un code d'invitation (sans auth)
      description: |
        ## ✅ Valider un code d'invitation

        **Utilisation :**
        - Vérifier qu'un code d'invitation est valide avant de démarrer la participation
        - Récupérer les informations du quiz et de l'invitation
        - Optionnel : peut être appelé avant `POST /participations`

        **Cas d'usage :**
        - Page de validation de code d'invitation
        - Vérification côté frontend avant participation

        **Note :** Cette endpoint ne nécessite pas d'authentification car elle est utilisée par les invités
        **Email :** Un email de confirmation peut être envoyé automatiquement lors de la validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code_acces]
              properties:
                code_acces:
                  type: string
                  description: Code d'invitation reçu par email (32 caractères hexadécimaux)
                  example: "df22be74d996f008cb04ee412b5f1aa1"
            example:
              code_acces: "df22be74d996f008cb04ee412b5f1aa1"
      responses:
        '200':
          description: Code d'invitation valide
          content:
            application/json:

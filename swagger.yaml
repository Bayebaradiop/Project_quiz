  /quizzes/{quizId}/generate-from-document:
    post:
      tags: [Intelligence Artificielle]
      summary: "📄 Générer des questions depuis un document"
      description: |
        ## 📤 Upload de documents pour génération contextuelle + Création en base de données
        
        Upload un document (PDF, Word, Image) et génère automatiquement des questions basées sur son contenu **puis les crée en base de données**.
        
        **📁 Formats supportés :**
        - PDF (`.pdf`)
        - Word (`.docx`)
        - Images (`.jpg`, `.jpeg`, `.png`) - avec OCR
        
        **🔧 Fonctionnement :**
        1. Upload du fichier (max 10 MB)
        2. Extraction automatique du texte (OCR pour images)
        3. Génération de questions via Groq AI avec contexte du document
        4. **Parsing et validation avec `createQuestionSchema`**
        5. **Création automatique en base via `QuestionService`**
        6. Nettoyage automatique du fichier temporaire
        7. Retour des questions créées (format identique aux autres endpoints)
        
        **💡 OCR pour images :**
        - Support français + anglais (Tesseract.js)
        - Extraction automatique du texte visible
        - Fonctionne avec JPG, JPEG, PNG
        
        **✅ Avantages :**
        - Questions contextuelles basées sur le contenu réel du document
        - Même validation et format que les autres méthodes de création
        - Questions immédiatement disponibles dans le quiz
        - Métadonnées du document incluses dans la réponse
        
        **Cas d'usage :**
        - Créer un quiz depuis un cours PDF
        - Générer des questions depuis des slides PowerPoint (exportés en images)
        - Quiz basé sur des documents de formation
        - Évaluation automatique depuis des supports pédagogiques
      security:
        - cookieAuth: []
      parameters:
        - name: quizId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/HashId'
          example: "Qp3ndGMw"
          description: ID crypté du quiz
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [document]
              properties:
                document:
                  type: string
                  format: binary
                  description: Fichier à uploader (PDF, Word, Image)
                numQuestions:
                  type: integer
                  default: 5
                  description: Nombre de questions à générer
                  example: 5
                difficulty:
                  type: string
                  default: "moyen"
                  enum: [facile, moyen, difficile]
                  description: Niveau de difficulté des questions
                  example: "moyen"
      responses:
        '201':
          description: Questions générées ET créées en base de données depuis le document
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: Format pour UNE seule question générée
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: "Question créée avec succès"
                      data:
                        type: object
                        description: Question créée (format identique à la création manuelle et par IA)
                      metadata:
                        type: object
                        properties:
                          documentName:
                            type: string
                            example: "cours-biologie.pdf"
                          documentType:
                            type: string
                            example: "application/pdf"
                          extractedChars:
                            type: integer
                            example: 2543
                  - type: object
                    description: Format pour PLUSIEURS questions générées
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: "3 questions créées avec succès"
                      data:
                        type: array
                        description: Tableau des questions créées
                        items:
                          type: object
                      metadata:
                        type: object
                        properties:
                          documentName:
                            type: string
                            example: "cours-biologie.pdf"
                          documentType:
                            type: string
                            example: "application/pdf"
                          extractedChars:
                            type: integer
                            example: 2543
                          numQuestionsRequested:
                            type: integer
                            example: 5
              examples:
